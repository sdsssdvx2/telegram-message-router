name: Validate latest Eternal bridge once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/eternal-bridge-validate-once.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRIVATE_AUTOMATION_TOKEN: ${{ secrets.PRIVATE_AUTOMATION_TOKEN }}
    steps:
      - name: Dispatch private bridge validator
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_AUTOMATION_TOKEN:-}"
          code="$(curl -sS -o /tmp/response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${PRIVATE_AUTOMATION_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/sdsssdvx2/eternal-android-builds/actions/workflows/validate-release-bridge.yml/dispatches \
            -d '{"ref":"main"}')"
          if [ "$code" != '204' ]; then
            cat /tmp/response
            echo "::error::Bridge validation dispatch returned HTTP ${code}"
            exit 1
          fi
          echo 'Latest Eternal bridge validation dispatched once.'
