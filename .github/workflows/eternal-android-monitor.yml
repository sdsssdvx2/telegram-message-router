name: Eternal Android target monitor

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eternal-android-monitor.yml'

permissions:
  contents: read

concurrency:
  group: eternal-android-target-monitor
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIVATE_AUTOMATION_TOKEN: ${{ secrets.PRIVATE_AUTOMATION_TOKEN }}
      PUBLIC_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch current main only when stable targets change
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ.get('PRIVATE_AUTOMATION_TOKEN', '').strip()
          public_token = os.environ.get('PUBLIC_GITHUB_TOKEN', '').strip()
          if not token:
              raise RuntimeError('PRIVATE_AUTOMATION_TOKEN is not configured')

          repo = 'sdsssdvx2/eternal-android-builds'
          production_ref = 'main'
          api = 'https://api.github.com'
          public_headers = {
              'User-Agent': 'Eternal-Public-Target-Monitor/3',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if public_token:
              public_headers['Authorization'] = 'Bearer ' + public_token
          private_headers = {
              'User-Agent': 'Eternal-Public-Target-Monitor/3',
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def fetch_bytes(url, headers=None):
              request = urllib.request.Request(url, headers=headers or public_headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def fetch_json(url, headers=None):
              return json.loads(fetch_bytes(url, headers).decode('utf-8'))

          def dispatch(workflow, ref, inputs=None):
              url = f'{api}/repos/{repo}/actions/workflows/{workflow}/dispatches'
              payload = {'ref': ref}
              if inputs is not None:
                  payload['inputs'] = inputs
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={**private_headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f'{workflow} dispatch returned HTTP {response.status}')
              print(f'dispatched {workflow} on {ref}')

          def workflow_runs(workflow, ref=None, per_page=30):
              query = {'per_page': per_page}
              if ref: query['branch'] = ref
              return fetch_json(
                  f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?{urllib.parse.urlencode(query)}',
                  private_headers,
              ).get('workflow_runs', [])

          morphe_release = fetch_json('https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest')
          eternal_release = fetch_json('https://api.github.com/repos/sdsssdvx2/eternal-youtube-history-patches/releases/latest')
          morphe = morphe_release['tag_name']
          eternal = eternal_release['tag_name']

          raw_headers = {'User-Agent': 'Eternal-Public-Target-Monitor/3'}
          youtube_text = fetch_bytes(
              f'https://raw.githubusercontent.com/MorpheApp/morphe-patches/{morphe}/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt', raw_headers,
          ).decode('utf-8')
          music_text = fetch_bytes(
              f'https://raw.githubusercontent.com/MorpheApp/morphe-patches/{morphe}/patches/src/main/kotlin/app/morphe/patches/music/shared/Constants.kt', raw_headers,
          ).decode('utf-8')
          eternal_text = fetch_bytes(
              f'https://raw.githubusercontent.com/sdsssdvx2/eternal-youtube-history-patches/{eternal}/patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt', raw_headers,
          ).decode('utf-8')

          state_meta = fetch_json(f'{api}/repos/{repo}/contents/build-state.json?ref=main', private_headers)
          state = json.loads(base64.b64decode(state_meta['content']).decode('utf-8'))

          def stable_versions(text):
              result = []
              for match in re.finditer(r'AppTarget\((.*?)\)', text, re.S):
                  block = match.group(1)
                  version = re.search(r'version\s*=\s*"([^"]+)"', block)
                  if not version or re.search(r'isExperimental\s*=\s*true', block):
                      continue
                  result.append(version.group(1))
              if not result: raise RuntimeError('No stable target found')
              return result

          supported_by_eternal = set(re.findall(r'AppTarget\(\s*version\s*=\s*"([^"]+)"', eternal_text, re.S))
          if not supported_by_eternal: raise RuntimeError('No Eternal YouTube compatibility targets found')

          def version_key(value): return tuple(int(part) for part in value.split('.'))
          current_yt = state.get('youtube') or '0.0.0'
          current_music = state.get('youtube_music') or '0.0.0'
          youtube = next((v for v in stable_versions(youtube_text) if v in supported_by_eternal and version_key(v) >= version_key(current_yt)), None)
          music = next((v for v in stable_versions(music_text) if version_key(v) >= version_key(current_music)), None)
          if youtube is None: raise RuntimeError(f'No non-downgrade Eternal-compatible YouTube target above {current_yt}')
          if music is None: raise RuntimeError(f'No non-downgrade Music target above {current_music}')

          fingerprint = f'{morphe}|{eternal}|yt:{youtube}|music:{music}'
          previous = state.get('fingerprint') or ''
          print(f'resolved={fingerprint}')
          print(f'deployed={previous}')
          if fingerprint == previous:
              print('Resolved Android targets are unchanged; no private runner is started.')
              sys.exit(0)

          android_runs = workflow_runs('build-android.yml', production_ref)
          active = [run for run in android_runs if run.get('status') != 'completed']
          if active:
              print('A production Android run is active; no duplicate dispatch.')
              sys.exit(0)
          if android_runs:
              latest = android_runs[0]
              created = datetime.fromisoformat(latest['created_at'].replace('Z', '+00:00'))
              age_hours = (datetime.now(timezone.utc) - created).total_seconds() / 3600
              if latest.get('status') in ('queued', 'in_progress', 'waiting', 'pending', 'requested') or age_hours < 4:
                  print('A recent private Android build request already exists; cooldown prevents duplicate dispatch.')
                  sys.exit(0)

          # Production CI is validated before merge. Polling must not dispatch obsolete
          # integration branches or repeatedly rerun expensive acceptance workflows.
          dispatch('build-android.yml', production_ref, {'force_build': 'false'})
          print(f'Changed stable targets dispatched on {production_ref}.')
          PY

