name: Eternal Android target monitor

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eternal-android-monitor.yml'

permissions:
  contents: read

concurrency:
  group: eternal-android-target-monitor
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PRIVATE_AUTOMATION_TOKEN: ${{ secrets.PRIVATE_AUTOMATION_TOKEN }}
      PUBLIC_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Validate hardened integration and dispatch private Android build only on change
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, re, sys, time, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ.get('PRIVATE_AUTOMATION_TOKEN', '').strip()
          public_token = os.environ.get('PUBLIC_GITHUB_TOKEN', '').strip()
          if not token:
              print('PRIVATE_AUTOMATION_TOKEN is not configured yet; public monitor is idle.')
              sys.exit(0)

          repo = 'sdsssdvx2/eternal-android-builds'
          integration_ref = 'hardening/integration-v2'
          api = 'https://api.github.com'
          public_headers = {
              'User-Agent': 'Eternal-Public-Target-Monitor/2',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          if public_token:
              public_headers['Authorization'] = 'Bearer ' + public_token
          private_headers = {
              'User-Agent': 'Eternal-Public-Target-Monitor/2',
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def fetch_bytes(url, headers=None):
              request = urllib.request.Request(url, headers=headers or public_headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def fetch_json(url, headers=None):
              return json.loads(fetch_bytes(url, headers).decode('utf-8'))

          def dispatch(workflow, ref, inputs=None):
              url = f'{api}/repos/{repo}/actions/workflows/{workflow}/dispatches'
              payload = {'ref': ref}
              if inputs is not None:
                  payload['inputs'] = inputs
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers={**private_headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f'{workflow} dispatch returned HTTP {response.status}')
              print(f'dispatched {workflow} on {ref}')

          def wait_for_dispatch(workflow, ref, started_after, timeout_minutes):
              deadline = time.monotonic() + timeout_minutes * 60
              query = urllib.parse.urlencode({
                  'event': 'workflow_dispatch',
                  'branch': ref,
                  'per_page': 10,
              })
              runs_url = f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?{query}'
              run_id = None
              last_status = None
              while time.monotonic() < deadline:
                  runs = fetch_json(runs_url, private_headers).get('workflow_runs', [])
                  eligible = []
                  for run in runs:
                      created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                      if created >= started_after and run.get('head_branch') == ref:
                          eligible.append(run)
                  if eligible:
                      run = sorted(eligible, key=lambda item: item['created_at'], reverse=True)[0]
                      run_id = run['id']
                      status = run.get('status')
                      conclusion = run.get('conclusion')
                      marker = (status, conclusion)
                      if marker != last_status:
                          print(f'{workflow} run={run_id} status={status} conclusion={conclusion}')
                          last_status = marker
                      if status == 'completed':
                          if conclusion != 'success':
                              raise RuntimeError(
                                  f'{workflow} integration acceptance failed: run={run_id} conclusion={conclusion}'
                              )
                          return run_id
                  time.sleep(10)
              raise TimeoutError(f'{workflow} integration acceptance timed out; latest run={run_id}')

          def run_gate(workflow, timeout_minutes):
              started_after = datetime.now(timezone.utc) - timedelta(seconds=10)
              dispatch(workflow, integration_ref)
              return wait_for_dispatch(workflow, integration_ref, started_after, timeout_minutes)

          morphe_release = fetch_json('https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest')
          eternal_release = fetch_json('https://api.github.com/repos/sdsssdvx2/eternal-youtube-history-patches/releases/latest')
          morphe = morphe_release['tag_name']
          eternal = eternal_release['tag_name']

          raw_headers = {'User-Agent': 'Eternal-Public-Target-Monitor/2'}
          youtube_text = fetch_bytes(
              f'https://raw.githubusercontent.com/MorpheApp/morphe-patches/{morphe}/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt',
              raw_headers,
          ).decode('utf-8')
          music_text = fetch_bytes(
              f'https://raw.githubusercontent.com/MorpheApp/morphe-patches/{morphe}/patches/src/main/kotlin/app/morphe/patches/music/shared/Constants.kt',
              raw_headers,
          ).decode('utf-8')
          eternal_text = fetch_bytes(
              f'https://raw.githubusercontent.com/sdsssdvx2/eternal-youtube-history-patches/{eternal}/patches/src/main/kotlin/app/eternal/patches/youtube/history/EternalHistoryPatch.kt',
              raw_headers,
          ).decode('utf-8')

          state_meta = fetch_json(
              f'{api}/repos/{repo}/contents/build-state.json?ref=main',
              private_headers,
          )
          state = json.loads(base64.b64decode(state_meta['content']).decode('utf-8'))

          def stable_versions(text):
              result = []
              for match in re.finditer(r'AppTarget\((.*?)\)', text, re.S):
                  block = match.group(1)
                  version = re.search(r'version\s*=\s*"([^"]+)"', block)
                  if not version or re.search(r'isExperimental\s*=\s*true', block):
                      continue
                  result.append(version.group(1))
              if not result:
                  raise RuntimeError('No stable target found')
              return result

          supported_by_eternal = set(re.findall(r'AppTarget\(\s*version\s*=\s*"([^"]+)"', eternal_text, re.S))
          if not supported_by_eternal:
              raise RuntimeError('No Eternal YouTube compatibility targets found')

          def version_key(value):
              return tuple(int(part) for part in value.split('.'))

          current_yt = state.get('youtube') or '0.0.0'
          current_music = state.get('youtube_music') or '0.0.0'
          youtube = next((v for v in stable_versions(youtube_text) if v in supported_by_eternal and version_key(v) >= version_key(current_yt)), None)
          music = next((v for v in stable_versions(music_text) if version_key(v) >= version_key(current_music)), None)
          if youtube is None:
              raise RuntimeError(f'No non-downgrade Eternal-compatible YouTube target above {current_yt}')
          if music is None:
              raise RuntimeError(f'No non-downgrade Music target above {current_music}')

          fingerprint = f'{morphe}|{eternal}|yt:{youtube}|music:{music}'
          previous = state.get('fingerprint') or ''
          print(f'resolved={fingerprint}')
          print(f'deployed={previous}')
          if fingerprint == previous:
              print('Resolved Android targets are unchanged; no private runner is started.')
              sys.exit(0)

          # A blocked or slow private runner must not be re-dispatched repeatedly.
          runs = fetch_json(
              f'{api}/repos/{repo}/actions/workflows/build-android.yml/runs?event=workflow_dispatch&per_page=10',
              private_headers,
          ).get('workflow_runs', [])
          if runs:
              latest = runs[0]
              created = datetime.fromisoformat(latest['created_at'].replace('Z', '+00:00'))
              age_hours = (datetime.now(timezone.utc) - created).total_seconds() / 3600
              print(
                  'latest_private_dispatch='
                  f"status:{latest.get('status')} conclusion:{latest.get('conclusion')} age_hours:{age_hours:.2f}"
              )
              if latest.get('status') in ('queued', 'in_progress', 'waiting', 'pending', 'requested') or age_hours < 4:
                  print('A recent private build request already exists; cooldown prevents duplicate dispatch.')
                  sys.exit(0)

          print('Target changed. Running fail-closed integration acceptance before any Android release build.')
          gateway_run = run_gate('test-update-gateway.yml', 10)
          updater_build_run = run_gate('build-updater.yml', 20)
          updater_runtime_run = run_gate('test-updater-runtime.yml', 30)
          print(
              'integration acceptance passed: '
              f'gateway={gateway_run} updater-build={updater_build_run} updater-runtime={updater_runtime_run}'
          )

          dispatch('build-android.yml', integration_ref, {'force_build': 'false'})
          print(
              'All hardening gates passed; latest Eternal/Morphe/YouTube/Music target '
              f'was dispatched on {integration_ref}.'
          )
          PY
