name: Telegram message router

# The router runs on an always-on server (ROUTER_LOOP_SECONDS=60).
# This workflow is kept for manual runs only, so the same Telegram session is
# never used from two places at once.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-message-router
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Route new Telegram messages
        env:
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          SOURCE_CHAT_ID: ${{ secrets.SOURCE_CHAT_ID }}
          DOCUMENT_TARGET_CHAT_ID: ${{ secrets.DOCUMENT_TARGET_CHAT_ID }}
          LINK_TARGET_CHAT_ID: ${{ secrets.LINK_TARGET_CHAT_ID }}
        run: python router_once.py
