name: Resume hardened Eternal Android build once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/eternal-integration-resume-once.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PRIVATE_AUTOMATION_TOKEN: ${{ secrets.PRIVATE_AUTOMATION_TOKEN }}
    steps:
      - name: Dispatch one hardened integration build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRIVATE_AUTOMATION_TOKEN:-}"
          code="$(curl -sS -o /tmp/response -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${PRIVATE_AUTOMATION_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/sdsssdvx2/eternal-android-builds/actions/workflows/build-android.yml/dispatches \
            -d '{"ref":"hardening/integration-v2","inputs":{"force_build":"false"}}')"
          if [ "$code" != '204' ]; then
            cat /tmp/response
            echo "::error::Private integration dispatch returned HTTP ${code}"
            exit 1
          fi
          echo 'Hardened integration build dispatched exactly once.'
