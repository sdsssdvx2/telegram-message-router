name: Keep scheduled workflows active

on:
  schedule:
    # Create lightweight repository activity once a week so GitHub does not
    # auto-disable scheduled workflows after 60 days of inactivity.
    - cron: "37 4 * * 0"

permissions:
  contents: write

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record repository activity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive.txt
          git commit -m "chore: keep scheduled workflows active"
          git push
